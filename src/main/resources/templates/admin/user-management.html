<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des utilisateurs</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        button {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📝 Créer un nouvel utilisateur</h1>

    <form id="createUserForm">
        <div class="form-group">
            <label for="username">Nom d'utilisateur</label>
            <input type="text" id="username" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required>
        </div>

        <div class="form-group">
            <label for="role">Rôle</label>
            <select id="role" required>
                <option value="STUDENT">Étudiant</option>
                <option value="TEACHER">Professeur</option>
            </select>
        </div>

        <button type="submit">Créer l'utilisateur</button>
    </form>

    <div id="result" class="result"></div>
</div>

<script th:src="@{/js/auth.js}"></script>
<script>
    // Vérifier l'authentification
    if (!checkAuth() || !checkRole('ADMIN')) {
        window.location.href = '/login';
    }

    document.getElementById('createUserForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const role = document.getElementById('role').value;
        const resultDiv = document.getElementById('result');

        try {
            const response = await fetch('/api/admin/users/create', {
                method: 'POST',
                headers: getAuthHeaders(),
                body: JSON.stringify({ username, email, role })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Erreur lors de la création');
            }

            // Afficher les credentials
            resultDiv.className = 'result success';
            resultDiv.innerHTML = `
                <h3>✅ Utilisateur créé avec succès !</h3>
                <p><strong>Username:</strong> ${data.username}</p>
                <p><strong>Email:</strong> ${data.email}</p>
                <p><strong>Mot de passe temporaire:</strong> ${data.tempPassword}</p>
                <p><strong>Rôle:</strong> ${data.role}</p>
                <p style="margin-top: 15px; color: #856404;">
                    ⚠️ Envoyez ces identifiants à l'utilisateur par email.
                </p>
            `;
            resultDiv.style.display = 'block';

            // Réinitialiser le formulaire
            document.getElementById('createUserForm').reset();

        } catch (error) {
            resultDiv.className = 'result error';
            resultDiv.innerHTML = `<strong>Erreur:</strong> ${error.message}`;
            resultDiv.style.display = 'block';
        }
    });
</script>
</body>
</html>
