<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - School Management</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            height: 100vh;
            background: #081b29;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ededed;
        }

        /* Glass card */
        .login-container {
            width: 380px;
            padding: 40px;
            border-radius: 15px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 0 30px rgba(3,233,244,0.2);
            text-align: center;
        }

        .login-container h2 {
            margin-bottom: 25px;
            font-weight: 600;
        }

        /* Inputs */
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.1);
            color: #ededed;
            font-size: 14px;
        }

        input::placeholder {
            color: #aaa;
        }

        /* Button neon */
        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #03e9f4;
            color: #081b29;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 10px #03e9f4;
        }

        button:hover {
            box-shadow: 0 0 25px #03e9f4;
            transform: translateY(-2px);
        }

        /* Error message */
        #error {
            margin-top: 15px;
            color: #ff4d4d;
            font-size: 14px;
        }

        /* Register link */
        .register-link {
            margin-top: 20px;
            font-size: 14px;
        }

        .register-link a {
            color: #03e9f4;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="login-container">
    <h2>Login</h2>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <p id="error"></p>

    <div class="register-link">
        Don't have an account?
        <a href="/register">Register</a>
    </div>
</div>

<script src="/js/auth.js"></script>

</body>
</html>
