<h2>Courses</h2>

<table>
    <tr>
        <th>Name</th><th>Semester</th><th>Credits</th><th>Teacher</th>
    </tr>
    <tr th:each="c : ${courses}">
        <td th:text="${c.name}"></td>
        <td th:text="${c.semester}"></td>
        <td th:text="${c.credits}"></td>
        <td th:text="${c.teacher?.name}"></td>
    </tr>
</table>
